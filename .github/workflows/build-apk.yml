name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to download assets from'
        required: false
        default: 'v1.5.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(curl -sL https://api.github.com/repos/the-hollowclan/LurkerX/releases/latest | jq -r .tag_name)"
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Failed to resolve release version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl wget unzip jq
          pip install --no-cache-dir -r requirements.txt

      - name: Download apktool
        run: |
          set -eux
          for url in \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" \
            "https://mirror.ghproxy.com/https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar"; do
            (curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 "$url" -o /tmp/apktool.jar \
             || wget -q --tries=3 --timeout=15 "$url" -O /tmp/apktool.jar) && break
          done
          test -s /tmp/apktool.jar
          printf '#!/bin/sh\nexec java -jar /tmp/apktool.jar "$@"\n' > /tmp/apktool
          chmod +x /tmp/apktool
          cp /tmp/apktool /tmp/apktool.jar ./
          echo "/tmp" >> $GITHUB_PATH

      - name: Download release assets
        run: |
          set -eux
          REPO="the-hollowclan/LurkerX"
          VERSION="${{ steps.version.outputs.version }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${VERSION}"
          mkdir -p build-tools result
          for url in \
            "${BASE_URL}/build-tools.zip" \
            "https://mirror.ghproxy.com/${BASE_URL}/build-tools.zip"; do
            (curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 "$url" -o /tmp/build-tools.zip \
             || wget -q --tries=3 --timeout=15 "$url" -O /tmp/build-tools.zip) && break
          done
          test -s /tmp/build-tools.zip
          unzip -q /tmp/build-tools.zip -d /tmp/build-tools-extracted
          cp -r /tmp/build-tools-extracted/build-tools/* build-tools/
          chmod +x build-tools/35.0.1/*
          rm -rf /tmp/build-tools.zip /tmp/build-tools-extracted
          for url in \
            "${BASE_URL}/base.apk" \
            "https://mirror.ghproxy.com/${BASE_URL}/base.apk"; do
            (curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 "$url" -o base.apk \
             || wget -q --tries=3 --timeout=15 "$url" -O base.apk) && break
          done
          test -s base.apk

      - name: Build APK
        run: |
          python -m packager
          cp result/final_signed.apk result/app.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: result/app.apk
          retention-days: 30

      - name: Print download URL
        run: |
          ARTIFACT_ID=$(curl -sL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/the-hollowclan/LurkerX/actions/runs/${{ github.run_id }}/artifacts" \
            | jq -r '.artifacts[] | select(.name == "app") | .id')
          if [ -n "$ARTIFACT_ID" ]; then
            echo "Download APK: https://nightly.link/the-hollowclan/LurkerX/actions/artifacts/${ARTIFACT_ID}.zip"
          fi
